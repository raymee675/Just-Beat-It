// GitHub Pages は深い URL にも同じ404を返すため、相対参照の基準をサイトルートへ戻す。
(() => {
  const parts = location.pathname.split('/').filter(Boolean);
  const project = parts.indexOf('just-beat-it');
  const directories = parts.length - (location.pathname.endsWith('/') ? 0 : 1);
  const depth = Math.max(0, directories - (project < 0 ? 0 : project + 1));
  const base = document.createElement('base');
  base.href = '../'.repeat(depth) || './';
  document.head.appendChild(base);
})();
</script><meta name="viewport" content="width=device-width,initial-scale=1">
